ShortDescription: Sovereign local-first universal bridge between desktop and mobile with instant clipboard sync, P2P file transfers, and pairing hub.
Description: |-
  Otium Link is a sovereign, local-first universal bridge designed for friction-free communication between desktop and mobile devices.
  It enables real-time clipboard synchronization, ultra-fast peer-to-peer file streaming, manual IP direct connection, and instant folder navigation across your local Wi-Fi network without relying on cloud intermediaries, accounts, or telemetry.
