ShortDescription: Zero-cloud, instant cross-device P2P clipboard and file transfer over local Wi-Fi.
Description: |-
  Otium Link is a secure, peer-to-peer (P2P) bridge connecting your Windows PC and Android phone over your local network.
  Features include real-time clipboard sync, high-speed file streaming with CRC32 verification, URL tracking parameter stripping, and a strict private subnet firewall.
