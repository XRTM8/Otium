ShortDescription: Sovereign, high-throughput multi-segment parallel download accelerator with live server probing and integrity verification.
Description: |-
  Otium Downloader is a sovereign, high-throughput, multi-segment download accelerator for Windows.
  It splits large downloads into 4x to 16x parallel HTTP byte-range streams, probes server capabilities in real time, displays live telemetry chunk-by-chunk in a real-time matrix, provides native destination folder navigation, verifies SHA-256 integrity locally, and recovers gracefully from network disconnects — with zero telemetry, zero cloud proxy servers, and zero accounts.
