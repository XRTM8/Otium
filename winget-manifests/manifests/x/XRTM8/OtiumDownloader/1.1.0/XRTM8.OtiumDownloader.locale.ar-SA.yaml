ShortDescription: مسرع تنزيل مستقل فائق السرعة متعدد المسارات مع فحص حي وتحقق تجزئة SHA-256 محلي بالكامل.
Description: |-
  أداة تنزيل مستقلة فائقة السرعة؛ تقسم الروابط إلى 4 حتى 16 مساراً متزامناً لاستغلال أقصى سرعة اتصال، مع فحص حي لإمكانات الخادم وتدفق النطاق، ومصفوفة تدفق حية لكل مسار، واستكشاف مباشر لمجلد التنزيل وتحكم جماعي واستئناف ذكي عند انقطاع الاتصال وفحص تجزئة SHA-256 محلياً بدون أي تتبع أو خوادم وسيطة.
