ShortDescription: High-performance sovereign multi-segment download accelerator.
Description: |-
  Otium Downloader is a sovereign, high-throughput, multi-segment download accelerator for Windows.
  It splits large downloads into parallel HTTP byte-range streams, tracks telemetry chunk-by-chunk in a real-time matrix, verifies SHA-256 integrity locally, and recovers gracefully from network disconnects — with zero telemetry, zero cloud proxy servers, and zero accounts.
