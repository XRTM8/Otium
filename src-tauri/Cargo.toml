[package]
name = "otium"
version = "1.5.3"
description = "A quiet, aesthetic, high-performance PDF reader"
authors = ["XRTM8"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "otium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
# APK size and install time are dominated by the Rust shared library. Strip
# symbols, keep thin LTO, and optimise for size; the PDF engine runs in JS.
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = "s"
