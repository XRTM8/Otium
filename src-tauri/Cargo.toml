[package]
name = "otium"
version = "0.1.0"
description = "A quiet, aesthetic, high-performance PDF reader"
authors = ["XRTM8"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "otium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["devtools"] }
tauri-plugin-log = "2"
