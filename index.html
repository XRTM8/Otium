<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ede1" />
    <meta name="description" content="Otium — The Quiet, Sovereign, Local-First PDF Reader & CamScanner-Grade Document Studio." />
    <meta name="application-name" content="Otium" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Otium" />

    <!-- Security: Content Security Policy (Sovereign Local-First Enforcement) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost blob: data: https://ntfy.tedomum.fr https://ntfy.sh https://github.com https://api.github.com https://*.githubusercontent.com https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob: data: mediastream:; object-src 'none'; base-uri 'none'; form-action 'none';"
    />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Otium" />
    <meta property="og:title" content="Otium — The Quiet Reader & Studio" />
    <meta property="og:description" content="A distraction-free, sovereign, local-first PDF reader and intelligent document scanner." />
    <meta property="og:image" content="./pwa-512x512.png" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Otium — The Quiet Reader & Studio" />
    <meta name="twitter:description" content="A distraction-free, sovereign, local-first PDF reader and intelligent document scanner." />
    <meta name="twitter:image" content="./pwa-192x192.png" />

    <!-- Icons & PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./pwa-192x192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <script src="/theme-init.js"></script>
    <title>Otium — The Quiet Reader</title>
  </head>
  <body class="antialiased selection:bg-amber-400/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
