Name: Otium Docs
Summary: Sovereign, offline document reader and camera scanner
Description: |-
  Otium Docs is a 100% local-first, privacy-respecting document workspace and camera
  scanner. It combines high-performance PDF reading with an on-device camera
  scanner, offline OCR, and zero cloud dependencies.

  Features:
  * 100% Offline and Local-First
  * Zero Telemetry, Zero Analytics, Zero Ads
  * Direct Optical Camera Scanner with auto boundary detection
  * Ultra-fast PDF rendering engine
  * Licensed under GNU General Public License v3.0

