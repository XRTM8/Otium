Name: Otium Link
Summary: Peer-to-peer LAN file transfer and clipboard bridge
Description: |-
  Otium Link is a sovereign, local-first utility for high-speed file transfer,
  instant clipboard synchronization, and offline smart board wireless presentations
  between Android, Windows, and interactive classroom displays over local Wi-Fi.

  Features:
  * Pure Peer-to-Peer (P2P) local transfers (40+ MB/s)
  * Seamless clipboard text synchronization
  * Smart Cast: Wireless presentation & laser pointer on smart TVs/boards without internet
  * Zero servers, zero telemetry, zero proxy relays
  * Fully signed, verified, and offline
  * Licensed under GNU General Public License v3.0

